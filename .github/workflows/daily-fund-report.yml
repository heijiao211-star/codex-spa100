name: Daily fund report

on:
  schedule:
    # GitHub Actions cron uses UTC. Beijing time is UTC+8.
    # Run a few minutes past the hour to reduce GitHub's top-of-hour queueing.
    # 11:07 CST -> 03:07 UTC, 16:17 CST -> 08:17 UTC.
    - cron: "7 3 * * *"
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Ignore sent-state and force send again"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: daily-fund-report
  cancel-in-progress: false

jobs:
  pushplus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send report
        env:
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send == 'true' }}
        run: |
          args="--send --twice-per-day"
          if [ "$FORCE_SEND" = "true" ]; then
            args="$args --force-send"
          fi
          python daily_fund_report_runtime.py $args

      - name: Persist sent-state
        if: always()
        run: |
          if [ -f .github/fund-report-state.json ]; then
            git add .github/fund-report-state.json
          fi
          if ! git diff --cached --quiet -- .github/fund-report-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update fund report sent state"
            git push
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fund-report
          path: reports/*.html
          if-no-files-found: ignore

