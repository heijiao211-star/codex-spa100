[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["src/fund_report"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

